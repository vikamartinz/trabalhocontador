<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Lufthansa · Contagem Regressiva</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="site-header-logo">
        <img src="assets/img/logo.png" alt="Lufthansa" />
      </a>
      <nav class="site-header-nav">
        <a href="index.html" class="active">Home</a>
        <a href="pages/landing.html">Aeronave</a>
        <a href="pages/contato.html">Contato</a>
      </nav>
    </header>

    <main class="countdown-main">
      <div class="split">
        <div class="left"></div>
        <div class="right"></div>
      </div>

      <div class="social">
        <div class="bar"></div>
      </div>

      <div class="countdown-content">
        <div class="countdown-eyebrow">Embarque para</div>
        <h1 class="countdown-title">O lançamento do novo <span>Boeing 747</span></h1>
        <div class="countdown-date">09 de outubro de 2026 12h00 (Brasília)</div>

        <div class="flap-board" aria-live="polite">
          <div class="flap-unit">
            <div class="flap"><span class="flap-digit" id="dias">00</span></div>
            <span class="flap-label">Dias</span>
          </div>
          <span class="flap-sep">:</span>
          <div class="flap-unit">
            <div class="flap"><span class="flap-digit" id="horas">00</span></div>
            <span class="flap-label">Horas</span>
          </div>
          <span class="flap-sep">:</span>
          <div class="flap-unit">
            <div class="flap"><span class="flap-digit" id="minutos">00</span></div>
            <span class="flap-label">Minutos</span>
          </div>
          <span class="flap-sep">:</span>
          <div class="flap-unit">
            <div class="flap"><span class="flap-digit" id="segundos">00</span></div>
            <span class="flap-label">Segundos</span>
          </div>
        </div>

        <p class="countdown-done" id="mensagemFim">O embarque foi liberado. Bem-vindo a bordo!</p>

        <div class="countdown-cta">
          <a href="pages/landing.html" class="plane-link" aria-label="Ir para a página do avião">
            <i class="fas fa-paper-plane"></i>
          </a>
          <div class="countdown-cta-text">
            <div class="big">Ver o Boeing 747</div>
          </div>
        </div>
      </div>
    </main>
        <footer class="site-footer">
  <div class="site-footer-inner">

    <a href="index.html" class="site-footer-brand">
      <img src="assets/img/logo.png" alt="Lufthansa" />
    </a>

    <nav class="site-footer-nav">
      <a href="index.html">Home</a>
      <a href="pages/landing.html">Aeronave</a>
      <a href="pages/contato.html">Contato</a>
    </nav>

    <div class="site-footer-social">

      <a href="https://www.instagram.com/lufthansa/"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Instagram">
        <i class="bi bi-instagram"></i>
      </a>

      <a href="https://x.com/lufthansanews"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Twitter">
        <i class="bi bi-twitter-x"></i>
      </a>

      
      <a href="https://www.linkedin.com/company/lufthansa/"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="LinkedIn">
        <i class="bi bi-linkedin"></i>
      </a>

    </div>
  </div>

  <div class="site-footer-bottom">
    © 2026 Lufthansa 
    <a href="#">Política de Privacidade</a>
    <a href="#">Termos de Uso</a>
  </div>
</footer>



    <script src="assets/js/script-countdown.js"></script>
  </body>
</html>
